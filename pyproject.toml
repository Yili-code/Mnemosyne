[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemosyne-telegram-bot"
version = "0.1.0"
description = "Mnemosyne: a personal vocabulary memory system powered by Gemini."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Yili" }]
keywords = [
  "telegram-bot",
  "vocabulary-learning",
  "gemini-api",
  "fastapi",
  "firestore",
  "cloud-run",
  "spaced-repetition",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "google-cloud-firestore>=2.19,<3",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "tzdata>=2026.1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://github.com/Yili-code/Mnemosyne"
Repository = "https://github.com/Yili-code/Mnemosyne.git"
Issues = "https://github.com/Yili-code/Mnemosyne/issues"
Documentation = "https://github.com/Yili-code/Mnemosyne#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/vocab_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
